name: Build and push to GHCR

on:
  push:
    branches: [docker]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'src/**'
      - 'systemd/**'
      - 'requirements.txt'
      - 'status.sh'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/galgo2077/eggshell

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -f

      - name: Build base
        run: make base

      - name: Build ollama
        run: make ollama

      - name: Build python
        run: make python

      - name: Build fastfetch
        run: make fastfetch

      - name: Build btop
        run: make btop

      - name: Build tmux
        run: make tmux

      - name: Build nvidia
        run: make nvidia

      - name: Build app
        run: make app

      - name: Push to GHCR
        run: docker push ${{ env.IMAGE }}:latest
